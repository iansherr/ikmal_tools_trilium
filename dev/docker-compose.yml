# Disposable Trilium instance for developing and testing the extension.
#
# This is NOT your daily-driver Trilium. Its data lives in ./data, which is
# gitignored and safe to delete at any time:
#
#   docker compose down -v && rm -rf data
#
# Usage:
#   docker compose up -d      # start, then open http://localhost:8080
#   docker compose logs -f    # watch startup
#   docker compose down       # stop, keep data

services:
  trilium:
    # Pinned rather than :latest so test runs are reproducible.
    image: triliumnext/trilium:v0.104.1
    container_name: trilium-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
    volumes:
      - ./data:/home/node/trilium-data
      # Backend scripting is disabled by default as of v0.104.0 and the
      # TRILIUM_SECURITY_* environment override does not apply to it — the
      # [Security] keys are only read from config.ini. Mounting our own copy
      # keeps the toggle in version control while ./data stays disposable.
      #
      # The note creation scripts (api.createTextNote, api.getDayNote) run on
      # the backend, so this instance must opt in. Only appropriate because the
      # container is local, disposable, and single-user: backend scripts get
      # full server access including the filesystem and OS commands.
      - ./config.ini:/home/node/trilium-data/config.ini
